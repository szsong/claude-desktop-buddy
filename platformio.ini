[env:m5stickc-plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5StickCPlus
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

; Waveshare ESP32-C6-Touch-LCD-1.69 (and the non-touch ESP32-C6-LCD-1.69).
; ESP32-C6 needs Arduino core 3.x, which comes from the pioarduino platform.
[env:waveshare-c6-lcd-169]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.filesystem = littlefs
board_build.partitions = partitions_16mb.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_WS_LCD_169
    -DBOARD_WS_C6_TOUCH_LCD_169
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> +<buddies/>
lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.2.30
    https://github.com/bitbank2/AnimatedGIF.git#2.1.1
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2

; Waveshare ESP32-S3-Touch-LCD-1.69 (ESP32-S3R8: 16 MB flash, 8 MB octal PSRAM).
[env:waveshare-s3-lcd-169]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = partitions_16mb.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DBOARD_WS_LCD_169
    -DBOARD_WS_S3_TOUCH_LCD_169
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> +<buddies/>
lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.2.30
    https://github.com/bitbank2/AnimatedGIF.git#2.1.1
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2

; First revision of the ESP32-S3-Touch-LCD-1.69: PWR key, power latch and
; buzzer share GPIO33-36 with the octal PSRAM, so PSRAM stays off.
[env:waveshare-s3-lcd-169-v1]
extends = env:waveshare-s3-lcd-169
board_build.arduino.memory_type = qio_qspi
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_WS_LCD_169
    -DBOARD_WS_S3_TOUCH_LCD_169
    -DBOARD_WS_S3_V1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Waveshare ESP32-C6-LCD-1.47 (ESP32-C6FH4: 4 MB flash, no PSRAM; 172x320 ST7789;
; one BOOT key, so the second key is a double-tap, see board/waveshare_lcd_147.h).
[env:waveshare-c6-lcd-147]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.filesystem = littlefs
board_build.partitions = partitions_4mb.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_WS_LCD_147
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> +<buddies/>
lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.2.30
    https://github.com/bitbank2/AnimatedGIF.git#2.1.1
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2

; Waveshare ESP32-S3-Touch-LCD-1.69: a separate, much smaller firmware
; (s3/main.cpp) with just the message screen, tap-to-approve and a menu. It talks
; to host/buddy_bridge.py or the desktop app over USB or Bluetooth (USB wins);
; no Wi-Fi, pet or stats screens.
; PSRAM is off (the message screen doesn't need it).
[env:waveshare-s3-lcd-169-usb]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<../s3/> +<ble_bridge.cpp>
lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.2.30
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2

; First revision of the board: power latch and buzzer on other pins (see
; board/waveshare_lcd_169.h).
[env:waveshare-s3-lcd-169-usb-v1]
extends = env:waveshare-s3-lcd-169-usb
build_flags =
    ${env:waveshare-s3-lcd-169-usb.build_flags}
    -DBOARD_WS_S3_V1
